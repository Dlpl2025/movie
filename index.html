<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Portal</title>

  <!-- Browser Tab Icon (Favicon) -->
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="shortcut icon" type="image/png" href="icon.png" />

  <style>
    /* CSS Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #030305;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Animated Red and Green Gradient Background */
    .animated-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #070a09 0%, #020202 100%);
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.45;
      will-change: transform;
    }

    .orb-green-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #00b347 0%, #006622 70%, transparent 100%);
      top: -10%;
      left: -12%;
      animation: floatOrbit1 18s ease-in-out infinite alternate;
    }

    .orb-red-1 {
      width: 540px;
      height: 540px;
      background: radial-gradient(circle, #cc1133 0%, #7a0014 70%, transparent 100%);
      bottom: -12%;
      right: -12%;
      animation: floatOrbit2 22s ease-in-out infinite alternate;
    }

    .orb-green-2 {
      width: 440px;
      height: 440px;
      background: radial-gradient(circle, #059669 0%, #047857 70%, transparent 100%);
      bottom: 10%;
      left: 15%;
      animation: floatOrbit3 24s ease-in-out infinite alternate;
    }

    .orb-red-2 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, #be123c 0%, #881337 70%, transparent 100%);
      top: 10%;
      right: 15%;
      animation: floatOrbit1 20s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatOrbit1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(60px, 80px) scale(1.12); }
      100% { transform: translate(-40px, 100px) scale(0.92); }
    }

    @keyframes floatOrbit2 {
      0% { transform: translate(0px, 0px) scale(0.95); }
      50% { transform: translate(-80px, -50px) scale(1.15); }
      100% { transform: translate(30px, -90px) scale(1); }
    }

    @keyframes floatOrbit3 {
      0% { transform: translate(0px, 0px) scale(1.08); }
      50% { transform: translate(70px, -70px) scale(0.88); }
      100% { transform: translate(-50px, 30px) scale(1.04); }
    }

    /* Fixed Top Center Logo (Home Button) */
    .top-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(3, 4, 6, 0.4);
    }

    .header-logo-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 10px 0;
      text-decoration: none;
      cursor: pointer;
    }

    .header-logo-container img {
      max-height: 52px;
      max-width: 180px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.75));
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .header-logo-container:hover img {
      transform: scale(1.08);
      filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.9));
    }

    .header-logo-container:active img {
      transform: scale(0.96);
    }

    /* Main Container */
    main {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 980px;
      padding: 95px 16px 35px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Grid Layout: Closer spacing and bigger size */
    .icons-grid {
      display: grid;
      width: 100%;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      justify-items: center;
      align-items: center;
    }

    /* Icon Cards - No border, deep black transparent shadow */
    .icon-card {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 200px;
      background: rgba(14, 18, 20, 0.5);
      border: none;
      outline: none;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 18px 36px -6px rgba(0, 0, 0, 0.75), 
                  0 8px 16px rgba(0, 0, 0, 0.55);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
                  box-shadow 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
                  background 0.25s ease;
    }

    /* GIF / Icon inside Card - Bigger size with black transparent drop-shadow */
    .icon-card img {
      width: 78%;
      height: 78%;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.65));
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    /* Hover & Active Effects */
    .icon-card:hover {
      transform: translateY(-6px) scale(1.04);
      background: rgba(22, 28, 32, 0.65);
      box-shadow: 0 24px 44px -4px rgba(0, 0, 0, 0.88), 
                  0 12px 22px rgba(0, 0, 0, 0.65);
    }

    .icon-card:hover img {
      transform: scale(1.06);
      filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.8));
    }

    .icon-card:active {
      transform: scale(0.96);
    }

    /* Responsive for Tablets */
    @media (max-width: 860px) {
      .icons-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .icon-card {
        max-width: 170px;
        border-radius: 22px;
      }
      .icon-card img {
        width: 80%;
        height: 80%;
      }
    }

    /* Responsive for Mobile (2 Columns x 4 Rows) */
    @media (max-width: 580px) {
      .top-header {
        height: 68px;
      }
      .header-logo-container img {
        max-height: 42px;
      }
      main {
        padding: 85px 14px 24px;
      }
      .icons-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        max-width: 380px;
      }
      .icon-card {
        max-width: 100%;
        border-radius: 20px;
        box-shadow: 0 14px 26px -4px rgba(0, 0, 0, 0.75);
      }
      .icon-card img {
        width: 78%;
        height: 78%;
      }
    }
  </style>
</head>
<body>

  <!-- Animated Red and Green Gradient Background -->
  <div class="animated-bg">
    <div class="glow-orb orb-green-1"></div>
    <div class="glow-orb orb-red-1"></div>
    <div class="glow-orb orb-green-2"></div>
    <div class="glow-orb orb-red-2"></div>
  </div>

  <!-- Fixed Top Header Logo (Home Button) -->
  <header class="top-header">
    <a href="index.html" class="header-logo-container" title="Home">
      <img src="logo.png" alt="" />
    </a>
  </header>

  <!-- 8 Animated GIF Navigation Cards linked to their folders -->
  <main>
    <div class="icons-grid">
      <!-- 1. Radio -->
      <a href="radio/index.html" class="icon-card">
        <img src="radio.gif" alt="" />
      </a>

      <!-- 2. TV -->
      <a href="tv/index.html" class="icon-card">
        <img src="tv.gif" alt="" />
      </a>

      <!-- 3. Sport -->
      <a href="sport/index.html" class="icon-card">
        <img src="sport.gif" alt="" />
      </a>

      <!-- 4. Music -->
      <a href="music/index.html" class="icon-card">
        <img src="music.gif" alt="" />
      </a>

      <!-- 5. Gallary -->
      <a href="gallary/index.html" class="icon-card">
        <img src="gallary.gif" alt="" />
      </a>

      <!-- 6. Ebook -->
      <a href="ebook/index.html" class="icon-card">
        <img src="ebook.gif" alt="" />
      </a>

      <!-- 7. Magazine -->
      <a href="magazine/index.html" class="icon-card">
        <img src="magazine.gif" alt="" />
      </a>

      <!-- 8. Telegram -->
      <a href="telegram/index.html" class="icon-card">
        <img src="telegram.gif" alt="" />
      </a>
    </div>
  </main>

</body>
</html>
